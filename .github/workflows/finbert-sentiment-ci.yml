name: FinBERT sentiment CI

on:
  pull_request:
    paths:
      - 'src/analysis/nlp_scorer.py'
      - 'src/analysis/sentiment_symbols.py'
      - 'src/analysis/sentiment_tool.py'
      - 'src/analysis/signal_aggregator.py'
      - 'scripts/run_sentiment_pipeline.py'
      - 'tests/test_finbert_sentiment.py'
      - 'requirements.txt'
      - '.github/workflows/finbert-sentiment-ci.yml'
  push:
    branches:
      - feature/finbert-sentiment-tool

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip pytest requests numpy
      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            src/analysis/nlp_scorer.py \
            src/analysis/sentiment_symbols.py \
            src/analysis/sentiment_tool.py \
            src/analysis/signal_aggregator.py \
            scripts/run_sentiment_pipeline.py
      - name: Run focused tests
        id: focused_pytest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pytest -vv tests/test_finbert_sentiment.py 2>&1 | tee finbert-test-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Upload focused test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finbert-test-output
          path: finbert-test-output.txt
      - name: Enforce focused test result
        if: steps.focused_pytest.outputs.exit_code != '0'
        run: exit 1
