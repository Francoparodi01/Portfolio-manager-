name: FinBERT sentiment CI

on:
  pull_request:
    paths:
      - 'src/analysis/nlp_scorer.py'
      - 'src/analysis/sentiment_symbols.py'
      - 'src/analysis/sentiment_tool.py'
      - 'src/analysis/signal_aggregator.py'
      - 'scripts/run_sentiment_pipeline.py'
      - 'tests/test_finbert_sentiment.py'
      - 'requirements.txt'
  push:
    branches:
      - feature/finbert-sentiment-tool

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip pytest requests numpy
      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            src/analysis/nlp_scorer.py \
            src/analysis/sentiment_symbols.py \
            src/analysis/sentiment_tool.py \
            src/analysis/signal_aggregator.py \
            scripts/run_sentiment_pipeline.py
      - name: Run focused tests
        run: pytest -q tests/test_finbert_sentiment.py
