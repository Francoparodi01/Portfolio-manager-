name: Opportunities V1 checks

on:
  pull_request:
    paths:
      - 'src/monitor/opportunities.py'
      - 'src/monitor/api.py'
      - 'tests/test_opportunities_monitor.py'
      - 'frontend/**'
      - '.github/workflows/opportunities-v1-ci.yml'
  workflow_dispatch:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only endpoint tests
        run: python -m unittest discover -s tests -p 'test_opportunities_monitor.py' -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck and bundle
        run: npm run build
