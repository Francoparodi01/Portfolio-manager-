name: Optimizer Structural V2 Validation

on:
  pull_request:
    paths:
      - "src/analysis/**"
      - "scripts/run_analysis.py"
      - "tests/**"
      - ".github/workflows/optimizer-structural-v2.yml"
  push:
    branches:
      - "feature/optimizer-calibration-v2-structural"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile changed runtime
        run: python -m compileall -q src/analysis scripts/run_analysis.py
      - name: Structural v2 tests
        run: python -m pytest -q tests/test_optimizer_structural_v2.py tests/test_upcoming_earnings.py tests/test_execution_nominals_and_rotation.py
      - name: Full suite
        run: python -m pytest -q
